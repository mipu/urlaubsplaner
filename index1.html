<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlaubsplaner 2027</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: #f5f5f5; padding: 15px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #027c45 0%, #03a54e 100%); color: white; padding: 30px; display: flex; align-items: center; gap: 20px; }
        .header h1 { font-size: 28px; margin-bottom: 5px; font-weight: 600; }
        .main-content { padding: 30px; }
        .year-title { font-size: 24px; font-weight: 600; margin: 20px 0; color: #027c45; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .calendar-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 20px 0; }
        .calendar-table th { background: #027c45; color: white; padding: 10px 4px; text-align: center; font-weight: 600; }
        .calendar-table td { border: 1px solid #e0e0e0; padding: 4px 2px; text-align: center; height: 26px; cursor: pointer; }
        .calendar-table td.weekend { background: #e8e8e8; }
        .calendar-table .employee-name { background: #f5f5f5; font-weight: 600; text-align: left; padding-left: 10px; color: #027c45; min-width: 140px; }
        .day { display: flex; align-items: center; justify-content: center; border-radius: 3px; width: 100%; height: 100%; }
        .day.vacation { background: #4caf50; color: white; font-weight: 600; }
        .day.pending { background: #ffc107; color: #333; font-weight: 600; }
        .day.sick { background: #f44336; color: white; font-weight: 600; }
        .day.holiday { background: #9c27b0; color: white; font-weight: 600; }
        .button-group { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; background: #027c45; color: white; }
        button:hover { opacity: 0.9; }
        .error { color: #f44336; padding: 20px; background: #ffebee; border-radius: 4px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 id="firmennameDisplay">Urlaubsplaner</h1>
                <p>2027</p>
            </div>
        </div>

        <div class="main-content">
            <div id="loading" class="loading">Lädt Daten von Supabase...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div id="content" style="display:none;">
                <h2 class="year-title">Jahresplan 2027</h2>
                <div class="button-group">
                    <button onclick="previousMonth()">← Vorheriger Monat</button>
                    <button onclick="nextMonth()">Nächster Monat →</button>
                </div>
                <div id="calendarContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sbjexeclzmktghbdeqhy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_c5-P105ibFtFB4pyLllOMw_KBR74OYT';
        let supabase = null;

        let employees = [];
        let vacationData = {};
        let currentMonth = new Date().getMonth();
        let currentYear = 2027;

        // Warte auf Supabase Library
        function initSupabase() {
            if (window.supabase && window.supabase.createClient) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                loadData();
            } else {
                setTimeout(initSupabase, 100);
            }
        }

        async function loadData() {
            try {
                if (!supabase) {
                    throw new Error('Supabase nicht initialisiert');
                }

                // Lade Mitarbeiter
                const { data: emps, error: empsError } = await supabase
                    .from('employees')
                    .select('*')
                    .order('id');

                if (empsError) throw empsError;
                employees = emps || [];

                if (employees.length === 0) {
                    throw new Error('Keine Mitarbeiter gefunden');
                }

                // Lade Urlaubsdaten
                const { data: vacData, error: vacError } = await supabase
                    .from('vacation_entries')
                    .select('*');

                if (vacError) throw vacError;

                // Organisiere Urlaubsdaten
                vacationData = {};
                (vacData || []).forEach(entry => {
                    const key = `${entry.employee_id}-${entry.entry_date}`;
                    vacationData[key] = entry.status;
                });

                // Zeige Kalender
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderCalendar();

                // Real-time Updates
                if (supabase.channel) {
                    supabase
                        .channel('vacation_changes')
                        .on('postgres_changes',
                            { event: '*', schema: 'public', table: 'vacation_entries' },
                            () => {
                                loadData();
                            }
                        )
                        .subscribe();
                }

            } catch (error) {
                console.error('Fehler beim Laden:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerText = 'Fehler beim Laden: ' + (error.message || error);
            }
        }

        function renderCalendar() {
            const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                           'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';

            const monthName = months[currentMonth];
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDay.getDate();

            const table = document.createElement('table');
            table.className = 'calendar-table';

            // Header
            const headerRow = table.insertRow();
            const nameHeader = headerRow.insertCell();
            nameHeader.className = 'employee-name';
            nameHeader.textContent = monthName;

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(currentYear, currentMonth, day);
                const headerCell = headerRow.insertCell();
                headerCell.innerHTML = `<strong>${day}</strong><br><small>${['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][date.getDay()]}</small>`;
            }

            // Mitarbeiterzeilen
            employees.forEach(emp => {
                const row = table.insertRow();
                const nameCell = row.insertCell();
                nameCell.className = 'employee-name';
                nameCell.textContent = emp.name;

                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(currentYear, currentMonth, day);
                    const dateStr = date.toISOString().split('T')[0];
                    const cell = row.insertCell();

                    if (date.getDay() === 0 || date.getDay() === 6) {
                        cell.classList.add('weekend');
                    }

                    const key = `${emp.id}-${dateStr}`;
                    const status = vacationData[key] || 'normal';
                    const dayDiv = document.createElement('div');
                    dayDiv.className = `day ${status}`;
                    dayDiv.textContent = getStatusSymbol(status);
                    cell.appendChild(dayDiv);

                    cell.onclick = () => cycleStatus(emp.id, dateStr, cell, dayDiv);
                }
            });

            container.appendChild(table);
        }

        function getStatusSymbol(status) {
            switch(status) {
                case 'vacation': return '✓';
                case 'pending': return '!';
                case 'sick': return '✗';
                case 'holiday': return '●';
                default: return '';
            }
        }

        async function cycleStatus(employeeId, dateStr, cell, dayDiv) {
            const key = `${employeeId}-${dateStr}`;
            const current = vacationData[key] || 'normal';
            let next;

            switch(current) {
                case 'normal': next = 'vacation'; break;
                case 'vacation': next = 'pending'; break;
                case 'pending': next = 'sick'; break;
                case 'sick': next = 'normal'; break;
                default: next = 'normal';
            }

            try {
                if (next === 'normal') {
                    await supabase
                        .from('vacation_entries')
                        .delete()
                        .eq('employee_id', employeeId)
                        .eq('entry_date', dateStr);
                    delete vacationData[key];
                } else {
                    await supabase
                        .from('vacation_entries')
                        .upsert({ employee_id: employeeId, entry_date: dateStr, status: next });
                    vacationData[key] = next;
                }

                dayDiv.className = `day ${next}`;
                dayDiv.textContent = getStatusSymbol(next);
            } catch(error) {
                alert('Fehler: ' + error.message);
            }
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        // Starte beim Laden
        initSupabase();
    </script>
</body>
</html>
